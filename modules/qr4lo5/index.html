<script>
  (() => {
    const P = "modulex-yorum-genisleyen-serit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const genisle = (s, P) => {
        const L = [...s.querySelectorAll("." + P + "-panel")];
        if (L.length < 2) return;
        s.classList.add(P + "--js");
        const ac = (n) => L.forEach((x, j) => {
          const a = j === n;
          x.classList.toggle(P + "-panel--acik", a);
          const b = x.querySelector("." + P + "-tetik");
          if (b) b.setAttribute("aria-expanded", String(a));
        });
        const fare = !!(window.matchMedia && window.matchMedia("(hover: hover) and (min-width: 769px)").matches);
        L.forEach((x, j) => {
          const b = x.querySelector("." + P + "-tetik");
          if (b) { b.addEventListener("click", () => ac(j)); b.addEventListener("focus", () => ac(j)); }
          if (fare) x.addEventListener("mouseenter", () => ac(j));
        });
        ac(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      genisle(s, P, az);
    });
  })();
</script>

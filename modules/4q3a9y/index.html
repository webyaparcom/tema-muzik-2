  .modulex-galeri-hikaye-halka-kbaslik { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-galeri-hikaye-halka :is(.modulex-galeri-hikaye-halka-baslik, .modulex-galeri-hikaye-halka-ust, h3, h4, strong) { letter-spacing: 0; }

<script>
  (() => {
    const P = "modulex-galeri-hikaye-halka";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const hikaye = (s, P, az) => {
        const sahne = s.querySelector("[data-hk-sahne]");
        if (!sahne) return;
        const K = [...sahne.querySelectorAll("[data-hk]")];
        if (!K.length) return;
        s.classList.add(P + "--hjs");
        const tel = sahne.parentElement;
        const C = [...s.querySelectorAll("[data-hk-cubuk]")];
        const H = [...s.querySelectorAll("[data-hk-sec]")];
        const dur = s.querySelector("[data-hk-dur]");
        const sure = Math.max(2000, Number(sahne.dataset.hkSure) || 5000);
        let n = 0;
        let t0 = 0;
        let gecen = 0;
        let raf = 0;
        let oynuyor = false;
        let gorunur = !("IntersectionObserver" in window);
        let fare = false;
        let odak = false;
        let elle = false;
        const ciz = (p) => C.forEach((c, j) => c.style.setProperty("--p", String(j < n ? 1 : j === n ? p : 0)));
        const goster = (i) => {
          n = (i + K.length) % K.length;
          K.forEach((k, j) => { k.classList.toggle(P + "--aktif", j === n); k.setAttribute("aria-hidden", String(j !== n)); });
          H.forEach((h, j) => {
            if (j === n) h.setAttribute("aria-current", "true");
            else h.removeAttribute("aria-current");
            h.classList.toggle(P + "--goruldu", j < n);
          });
          gecen = 0;
          t0 = performance.now();
          ciz(0);
        };
        const adim = (t) => {
          if (!oynuyor) return;
          const p = Math.min(1, Math.max(0, gecen + t - t0) / sure);
          ciz(p);
          if (p >= 1) goster(n + 1);
          raf = requestAnimationFrame(adim);
        };
        const karar = () => {
          const v = !az && K.length > 1 && gorunur && !fare && !odak && !elle;
          if (v === oynuyor) return;
          oynuyor = v;
          if (v) { t0 = performance.now(); raf = requestAnimationFrame(adim); }
          else { gecen += performance.now() - t0; cancelAnimationFrame(raf); }
        };
        if (dur) {
          const ikon = dur.querySelector(".material-symbols-outlined");
          dur.hidden = az || K.length < 2;
          dur.addEventListener("click", () => {
            elle = !elle;
            dur.setAttribute("aria-pressed", String(elle));
            if (ikon) ikon.textContent = elle ? "play_arrow" : "pause";
            karar();
          });
        }
        s.querySelectorAll("[data-hk-git]").forEach((b) => b.addEventListener("click", () => goster(n + Number(b.dataset.hkGit))));
        H.forEach((h, j) => h.addEventListener("click", (e) => {
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
          e.preventDefault();
          goster(j);
        }));
        sahne.addEventListener("keydown", (e) => {
          const rtl = getComputedStyle(s).direction === "rtl";
          let i = null;
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") i = n + ((e.key === "ArrowRight") !== rtl ? 1 : -1);
          else if (e.key === "Home") i = 0;
          else if (e.key === "End") i = K.length - 1;
          if (i !== null) { e.preventDefault(); goster(i); }
        });
        if (tel) {
          tel.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") { fare = true; karar(); } });
          tel.addEventListener("pointerleave", () => { fare = false; karar(); });
          tel.addEventListener("focusin", () => { odak = true; karar(); });
          tel.addEventListener("focusout", (e) => { if (!tel.contains(e.relatedTarget)) { odak = false; karar(); } });
        }
        if (!gorunur) {
          const io = new IntersectionObserver((g) => { gorunur = g[g.length - 1].isIntersecting; karar(); }, { threshold: 0.35 });
          io.observe(tel || s);
        }
        goster(0);
        karar();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      hikaye(s, P, az);
    });
  })();
</script>
